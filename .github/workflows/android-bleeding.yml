name: 'DIAMOND · direct native Android NDK'
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ndk-debug:
    name: 'Native arm64-v8a offline debug APK'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact immutable source and canonical submodule
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & git init .
          if ($LASTEXITCODE -ne 0) { throw 'git init failed' }
          & git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          if ($LASTEXITCODE -ne 0) { throw 'git remote failed' }
          & git fetch --no-tags --depth 1 origin $env:GITHUB_REF
          if ($LASTEXITCODE -ne 0) { throw 'git fetch failed' }
          & git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git checkout failed' }
          $sha = ((& git rev-parse HEAD) | Out-String).Trim()
          if ($sha -cne $env:GITHUB_SHA) { throw 'Untrusted checkout SHA' }
          & git -c protocol.file.allow=never submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Canonical source checkout failed' }
      - name: Locate vendor platform SDK tools, no intermediary build layer
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_HOME)) { throw 'ANDROID_HOME missing' }
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager'
          if (!(Test-Path -LiteralPath $sdkmanager)) { throw 'SDK manager missing' }
          "SDK_MANAGER=$sdkmanager" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install pinned NDK API and platform build tools
        shell: pwsh
        run: |
          & $env:SDK_MANAGER 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Android packages unavailable' }
      - name: Build native C++20 library and locally sign debug APK
        shell: pwsh
        run: ./ci/Build-NativeAndroid.ps1
      - name: Preserve failure evidence and source hashes in job output
        if: always()
        shell: pwsh
        run: |
          ./ci/Write-AndroidEvidence.ps1 -EvidenceDir evidence-android
          if (Test-Path evidence-android/native-apk-record.json) {
            Get-Content evidence-android/native-apk-record.json
          }
