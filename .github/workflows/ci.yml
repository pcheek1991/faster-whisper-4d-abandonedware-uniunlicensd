name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:
    branches:
      - master

jobs:
  check-code-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install module
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check code format with Black
        run: |
          black --check .

      - name: Check imports order with isort
        run: |
          isort --check-only .

      - name: Check code style with Flake8
        if: ${{ always() }}
        run: |
          flake8 .


  run-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install module
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Prepare test evidence
        run: mkdir -p evidence

      - name: Run validation-only tests
        run: python -m pytest -q -m "not integration" --junitxml=evidence/validation.xml

      # Model-weight integration tests are intentionally unavailable in
      # this weight-free experiment. Do not label an unrun test PASS.
      - name: Record intentionally unrun model integration scope
        shell: pwsh
        run: |
          'NOT RUN: integration tests require pretrained model weights.' |
            Tee-Object -FilePath evidence/integration-not-run.txt

      - name: Capture Python test provenance even on failure
        if: always()
        shell: pwsh
        run: |
          ./ci/Write-CheckpointEvidence.ps1 -EvidenceDir evidence
          ./ci/Test-CheckpointEvidence.ps1 -EvidenceDir evidence

      - name: Upload Python test evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-test-evidence-${{ matrix.python-version }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90

  audit-dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Audit runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[security]"
          python -m pip_audit -r requirements.txt

  build-package-review-only:
    runs-on: ubuntu-latest
    needs: [check-code-format, run-tests, audit-dependencies]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Build package
        run: |
          python3 setup.py sdist bdist_wheel

      # Publication deliberately disabled: no LICENSE exists and inherited
      # package metadata still asserts MIT. Do not issue a new grant or publish
      # until the maintainer completes a documented third-party rights review.
      - name: Record local package fingerprints for rights review
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath dist -File | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Output ("SHA256 {0} {1}" -f $hash, $_.Name)
          }
