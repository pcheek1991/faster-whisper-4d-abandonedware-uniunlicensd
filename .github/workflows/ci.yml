name: 'Native DIAMOND · C++20 CI'
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-boundary:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact immutable source and canonical submodule
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & git init .
          if ($LASTEXITCODE -ne 0) { throw 'git init failed' }
          & git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          if ($LASTEXITCODE -ne 0) { throw 'git remote failed' }
          & git fetch --no-tags --depth 1 origin $env:GITHUB_REF
          if ($LASTEXITCODE -ne 0) { throw 'git fetch failed' }
          & git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git checkout failed' }
          $sha = ((& git rev-parse HEAD) | Out-String).Trim()
          if ($sha -cne $env:GITHUB_SHA) { throw 'Untrusted checkout SHA' }
          & git -c protocol.file.allow=never submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Canonical source checkout failed' }
      - name: Retired source and rights boundary
        shell: pwsh
        run: ./ci/Test-NativeBoundary.ps1
  host-native:
    name: 'Native C++20 facets · ${{ matrix.name }}'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Linux-x64, runner: ubuntu-24.04}
          - {name: Windows-x64, runner: windows-2022}
          - {name: macOS-ARM64, runner: macos-15}
    steps:
      - name: Ensure PowerShell 7 for Git on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then brew install --cask powershell; fi
      - name: Checkout exact immutable source and canonical submodule
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & git init .
          if ($LASTEXITCODE -ne 0) { throw 'git init failed' }
          & git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          if ($LASTEXITCODE -ne 0) { throw 'git remote failed' }
          & git fetch --no-tags --depth 1 origin $env:GITHUB_REF
          if ($LASTEXITCODE -ne 0) { throw 'git fetch failed' }
          & git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git checkout failed' }
          $sha = ((& git rev-parse HEAD) | Out-String).Trim()
          if ($sha -cne $env:GITHUB_SHA) { throw 'Untrusted checkout SHA' }
          & git -c protocol.file.allow=never submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Canonical source checkout failed' }
      - name: Build all original and native C++20 programs
        shell: pwsh
        run: |
          cmake -S . -B build-native -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-native --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 'CTest validates parity, gain, native acoustic and 348 languages'
        shell: pwsh
        run: |
          ctest --test-dir build-native -C Release --output-on-failure
          exit $LASTEXITCODE
      - name: GAMP 4-style Pentagonal supplier validation and SHA-256 evidence
        shell: pwsh
        run: |
          ./ci/Invoke-PentagonalGamp4.ps1 -BuildDir build-native -EvidenceDir evidence-gamp4 -ExecutableName pentagonal_gamp4_integration_test
          if (!$?) { exit 1 }

