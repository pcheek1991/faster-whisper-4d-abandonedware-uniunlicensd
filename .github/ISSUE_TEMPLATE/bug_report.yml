name: Native DIAMOND bug report
description: Reproducible native C++20, Unicode, acoustic or platform behavior
title: "[Native bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Redact private recordings, secrets, personal data and source paths.
        Report security vulnerabilities privately.
  - type: textarea
    id: summary
    attributes:
      label: Observed versus expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Native CMake/CTest or DIAMOND command and safe synthetic inputs
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: OS, architecture, C++20 compiler, CMake and source revision
      description: Include platform SDK/NDK if reporting an Android build issue.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted test logs and relevant evidence
      render: text
    validations:
      required: false
